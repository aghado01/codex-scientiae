# Python project definition for the packaged codex-scientiae lane.
#
# jsonl_engine must be reachable under one import path for both tests and module execution. Two
# names for one package create distinct module objects and duplicate process-global registries.
#
# Restore the pinned interpreter, environment, and local uv runtime with:
#
#     ./brewery/uv/restore-uv.ps1
#
# pyproject.toml is the dependency authority. uv.lock freezes the resolved graph and
# requirements.txt is a generated compatibility export.

[build-system]
requires = [
    "editables==0.6",
    "hatchling==1.32.0",
]
build-backend = "hatchling.build"

[project]
name = "codex-scientiae"
version = "0.1.0"
description = "Codex Scientiae — Python lane for artifact registries and scholarly procurement"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7,<1",
    "filelock>=3.13,<4",
    "httpx>=0.28,<1",
    "jsonschema>=4.20,<5",
    "mcp>=2,<3",
    "pydantic>=2.13,<3",
]

[project.scripts]
scientiae-procurement = "procurement_mcp.server:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/jsonl_engine",
    "src/procurement",
    "src/mcp-servers/procurement_mcp",
]

[tool.hatch.build.targets.wheel.sources]
"src/jsonl_engine" = "jsonl_engine"
"src/procurement" = "procurement"
"src/mcp-servers/procurement_mcp" = "procurement_mcp"

[dependency-groups]
dev = [
    "editables==0.6",
    "hatchling==1.32.0",
    "pytest>=9,<10",
]

[tool.uv]
required-version = "==0.11.23"

[tool.pytest.ini_options]
# Anchors rootdir at the repository root so `pytest` and `python -m pytest` agree. Import resolution
# does not depend on the working directory -- that comes from the editable install, not from here --
# so the suite passes from any directory, including outside the repository.
#
# testpaths is honoured only when pytest is invoked FROM the rootdir; from a subdirectory pytest
# collects that subtree instead, which is its intended behaviour.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-p", "no:cacheprovider"]
